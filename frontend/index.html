<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algoma Research Opportunities</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    header {
      background: #172033;
      color: white;
      padding: 1.5rem;
    }

    header .inner {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      margin: 0 0 .4rem;
      font-size: 1.8rem;
    }

    header p {
      margin: 0;
      color: #d9deea;
    }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .controls {
      background: white;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .controls label {
      display: block;
      font-weight: 600;
      margin-bottom: .4rem;
    }

    select {
      width: 100%;
      max-width: 400px;
      padding: .7rem;
      border: 1px solid #ccd2dc;
      border-radius: 7px;
      background: white;
      font-size: 1rem;
    }

    h2 {
      margin-top: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 1.2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      border: 1px solid #e2e6ed;
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: .5rem;
    }

    .card p {
      line-height: 1.5;
    }

    .tag {
      display: inline-block;
      background: #edf1f7;
      padding: .3rem .55rem;
      border-radius: 20px;
      margin: .15rem;
      font-size: .85rem;
    }

    .meta {
      color: #566176;
      font-size: .9rem;
      margin: .4rem 0;
    }

    .preference {
      font-weight: 600;
      margin-top: .8rem;
    }

    .faculty-card {
      border-left: 4px solid #172033;
    }

    #status {
      min-height: 1.5rem;
      margin-bottom: 1rem;
    }

    .error {
      color: #a32020;
    }

    .empty {
      color: #566176;
      padding: 1rem 0;
    }

    @media (max-width: 390px) {
      header {
        padding: 1rem;
      }

      main {
        margin: 1rem auto;
        padding: 0 .75rem;
      }

      h1 {
        font-size: 1.45rem;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="inner">
    <h1>Algoma Research Opportunities</h1>
    <p>Discover faculty research areas and current student projects.</p>
  </div>
</header>

<main>

  <div class="controls">
    <label for="area">Filter by research area</label>

    <select id="area">
      <option value="">All research areas</option>
      <option value="Artificial Intelligence">Artificial Intelligence</option>
      <option value="Cybersecurity">Cybersecurity</option>
      <option value="Human-Computer Interaction">Human-Computer Interaction</option>
      <option value="Data Science">Data Science</option>
      <option value="Software Engineering">Software Engineering</option>
    </select>
  </div>

  <p id="status" aria-live="polite">Loading opportunities...</p>

  <section aria-labelledby="projects-heading">
    <h2 id="projects-heading">Current Projects</h2>
    <div id="projects" class="grid"></div>
  </section>

  <section aria-labelledby="faculty-heading">
    <h2 id="faculty-heading">Faculty</h2>
    <div id="faculty" class="grid"></div>
  </section>

</main>

<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
